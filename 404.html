<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Pusat Pemutar Media Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc;
            color: #0f172a;
            -webkit-tap-highlight-color: transparent;
        }
        .bg-pattern {
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="bg-pattern min-h-screen flex items-center justify-center p-4 sm:p-6">

    <!-- Card Wrapper -->
    <div class="w-full max-w-md bg-white border border-slate-200/80 rounded-3xl p-6 sm:p-8 shadow-xl shadow-slate-200/50 flex flex-col items-center text-center transition-all">
        
        <!-- Icon Media Header -->
        <div class="relative mb-6">
            <div class="w-16 h-16 sm:w-20 sm:h-20 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-2xl sm:text-3xl shadow-sm border border-blue-100">
                <i class="fas fa-play ml-1 text-blue-600"></i>
            </div>
            <!-- Status Dot Online -->
            <span class="absolute -top-1 -right-1 flex h-4 w-4">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-4 w-4 bg-emerald-500 border-2 border-white"></span>
            </span>
        </div>

        <!-- Tag Kategori -->
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-slate-100 text-slate-600 text-xs font-semibold mb-3">
            <i class="fas fa-signal text-[10px] text-blue-600"></i> Server Siap Putar
        </div>

        <!-- Judul Utama -->
        <h1 class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight leading-snug mb-3">
            Tonton Tayangan Video Lengkap
        </h1>

        <!-- Deskripsi Konten (Aman & Netral) -->
        <p class="text-slate-600 text-sm sm:text-base leading-relaxed mb-8 px-1">
            Klik tombol di bawah ini untuk membuka dan memutar pemutar tayangan berkecepatan tinggi langsung melalui peramban Anda.
        </p>

        <!-- Tombol Aksi Utama (Sangat Responsif & Menonjol) -->
        <button id="startBtn" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-bold py-4 px-6 rounded-2xl text-base sm:text-lg shadow-lg shadow-blue-600/25 transition-all flex items-center justify-center gap-3 group cursor-pointer">
            <span>Buka Pemutar Sekarang</span>
            <i class="fas fa-arrow-right text-sm transition-transform group-hover:translate-x-1"></i>
        </button>

        <!-- Informasi Tambahan / Indikator Kualitas -->
        <div class="mt-8 pt-5 border-t border-slate-100 w-full grid grid-cols-3 gap-2 text-slate-500 text-xs font-medium">
            <div class="flex flex-col items-center gap-1">
                <i class="fas fa-tv text-slate-400 text-sm"></i>
                <span>Kualitas HD</span>
            </div>
            <div class="flex flex-col items-center gap-1">
                <i class="fas fa-bolt text-amber-500 text-sm"></i>
                <span>Fast Buffering</span>
            </div>
            <div class="flex flex-col items-center gap-1">
                <i class="fas fa-mobile-screen-button text-slate-400 text-sm"></i>
                <span>Responsif</span>
            </div>
        </div>

    </div>

    <!-- Script Tombol Redirect -->
    <script>
        document.getElementById('startBtn').addEventListener('click', function() {
            setTimeout(function() {
                window.open('watch.html', '_blank');
                window.location.href = 'https://zonnews1.blogspot.com/';
            }, 100);
        });
    </script>

    <!-- Tracker Histats -->
    <script type='text/javascript'>
        var _Hasync=_Hasync||[];
        _Hasync.push(['Histats.start', '1,3344222,4,0,0,0,00010000']);
        _Hasync.push(['Histats.fasi', '1']);
        _Hasync.push(['Histats.track_hits', '']);
        (function(){
            var hs = document.createElement('script'); hs.async = true;
            hs.src = '//s10.histats.com/js15_as.js';
            (document.head||document.body).appendChild(hs);
        })();
    </script>
</body>
</html>
