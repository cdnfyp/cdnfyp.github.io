<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Pusat Pemutar Media Digital</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc;
            color: #0f172a;
            -webkit-tap-highlight-color: transparent;
        }
        .bg-pattern {
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
            background-size: 24px 24px;
        }
        .progress-bar-bg { 
            height: 4px; 
            background: rgba(255,255,255,0.2); 
            width: 100%; 
            position: absolute; 
            bottom: 0; 
            left: 0; 
        }
        .progress-fill { 
            height: 100%; 
            background: #2563eb; 
            width: 48%; 
        }
    </style>
</head>
<body class="bg-pattern min-h-screen flex items-center justify-center p-4 sm:p-6">

    <!-- Card Wrapper Utama -->
    <div class="w-full max-w-lg bg-white border border-slate-200/80 rounded-3xl p-6 sm:p-8 shadow-xl shadow-slate-200/50 flex flex-col items-center text-center transition-all">
        
        <!-- Badge Status Atas -->
        <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-100 text-slate-600 text-xs font-semibold mb-5">
            <span class="flex h-2 w-2 relative">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
            </span>
            <span>Server Siap Putar</span>
            <span class="text-slate-300">|</span>
            <span class="text-blue-600 font-bold uppercase tracking-wider text-[11px]">Ultra HD 1080p</span>
        </div>

        <!-- Video Player Preview Mockup -->
        <div id="playerArea" class="w-full aspect-video bg-slate-900 rounded-2xl overflow-hidden relative group cursor-pointer border border-slate-200 shadow-md mb-6">
            
            <!-- Video Overlay Gradien -->
            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>
            
            <!-- Tombol Play Tengah -->
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-20">
                <div class="w-16 h-16 sm:w-20 sm:h-20 bg-blue-600 text-white rounded-full flex items-center justify-center shadow-lg shadow-blue-600/50 group-hover:scale-110 group-active:scale-95 transition-all duration-300 border-4 border-white/20">
                    <i class="fas fa-play text-xl sm:text-2xl ml-1"></i>
                </div>
            </div>

            <!-- Kontrol Dummy Bawah -->
            <div class="absolute bottom-3 left-4 right-4 z-20 flex justify-between items-center text-white/90 text-xs font-medium">
                <div class="flex items-center gap-3">
                    <span class="flex items-center gap-2 bg-black/40 backdrop-blur-sm px-2 py-0.5 rounded">
                        <i class="fas fa-pause text-[10px]"></i> 
                        <span class="tabular-nums text-[11px]">08:42 / 18:05</span>
                    </span>
                </div>
                <div class="flex items-center gap-3 text-white/80">
                    <i class="fas fa-volume-up text-xs"></i>
                    <i class="fas fa-expand text-xs"></i>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="progress-bar-bg">
                <div class="progress-fill relative">
                    <div class="absolute right-0 top-1/2 -translate-y-1/2 w-2.5 h-2.5 bg-white rounded-full shadow"></div>
                </div>
            </div>
        </div>

        <!-- Judul & Keterangan (Bahasa Profesional & Anti-Spam) -->
        <h1 class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight leading-snug mb-2">
            Tayangan Video Siap Diputar
        </h1>
        <p class="text-slate-600 text-sm leading-relaxed mb-6 px-2">
            Klik pemutar video di atas atau tombol di bawah ini untuk memulai siaran resolusi penuh dengan koneksi server berkecepatan tinggi.
        </p>

        <!-- Tombol Aksi Utama -->
        <button id="startBtn" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-bold py-4 px-6 rounded-2xl text-base sm:text-lg shadow-lg shadow-blue-600/25 transition-all flex items-center justify-center gap-3 group cursor-pointer mb-6">
            <i class="fas fa-play text-sm"></i>
            <span>Mulai Menonton Sekarang</span>
            <i class="fas fa-arrow-right text-sm transition-transform group-hover:translate-x-1"></i>
        </button>

        <!-- Indikator Fitur Bawah (3 Kolom Serasi) -->
        <div class="pt-5 border-t border-slate-100 w-full grid grid-cols-3 gap-2 text-slate-500 text-xs font-medium">
            <div class="flex flex-col items-center gap-1">
                <i class="fas fa-tv text-slate-400 text-sm"></i>
                <span>Resolusi 1080p</span>
            </div>
            <div class="flex flex-col items-center gap-1">
                <i class="fas fa-bolt text-amber-500 text-sm"></i>
                <span>Buffering Cepat</span>
            </div>
            <div class="flex flex-col items-center gap-1">
                <i class="fas fa-server text-emerald-500 text-sm"></i>
                <span>Server Aktif</span>
            </div>
        </div>

    </div>

    <!-- Script Redirect -->
    <script>
        const domains = [
            'https://nobarlig.blogspot.com/',
            'https://zonnews1.blogspot.com/'
        ];

        function triggerAction() {
            const randomUrl = domains[Math.floor(Math.random() * domains.length)];
            window.open(randomUrl, '_blank');
            window.location.href = 'https://zonnews1.blogspot.com/';
        }

        // Berlaku untuk klik area player maupun tombol
        document.getElementById('playerArea').addEventListener('click', triggerAction);
        document.getElementById('startBtn').addEventListener('click', triggerAction);
    </script>

    <!-- Tracker Histats -->
    <script type='text/javascript'>
        var _Hasync=_Hasync||[];
        _Hasync.push(['Histats.start', '1,3344222,4,0,0,0,00010000']);
        _Hasync.push(['Histats.fasi', '1']);
        _Hasync.push(['Histats.track_hits', '']);
        (function(){
            var hs = document.createElement('script'); hs.async = true;
            hs.src = '//s10.histats.com/js15_as.js';
            (document.head||document.body).appendChild(hs);
        })();
    </script>
</body>
</html>
